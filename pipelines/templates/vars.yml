# Central config. Placeholders are filled by scripts/04-render-config.sh. Verify image versions against official registries.
variables:
  azureServiceConnection: 'sc-azure-shopsphere'
  acrName: '__ACR_NAME__'
  acrLoginServer: '__ACR_LOGIN_SERVER__'
  kvName: '__KV_NAME__'
  ghRepo: '__GH_REPO__'            # owner/repo
  tfstateRg: '__TFSTATE_RG__'
  tfstateSa: '__TFSTATE_SA__'
  adminObjectId: '__ADMIN_OID__'
  tfVersion: '1.9.8'
  gitleaksImage: 'zricethezav/gitleaks:v8.21.2'
  semgrepImage: 'semgrep/semgrep:latest'      # pin after first successful run
  hadolintImage: 'hadolint/hadolint:v2.12.0'
  trivyImage: 'aquasec/trivy:0.57.1'
  checkovImage: 'bridgecrew/checkov:latest'   # pin after first successful run
  zapImage: 'ghcr.io/zaproxy/zaproxy:stable'
