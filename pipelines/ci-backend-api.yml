trigger:
  branches: { include: [main] }
  paths: { include: [app/backend-api/*, pipelines/templates/*] }
pr:
  branches: { include: [main] }
  paths: { include: [app/backend-api/*] }
variables:
  - template: templates/vars.yml
  - group: shopsphere-secrets      # holds GH_PAT (secret)
stages:
  - template: templates/ci-service.yml
    parameters:
      serviceName: backend-api
      language: node
