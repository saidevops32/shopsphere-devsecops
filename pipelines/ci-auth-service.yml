trigger:
  branches: { include: [main] }
  paths: { include: [app/auth-service/*, pipelines/templates/*] }
pr:
  branches: { include: [main] }
  paths: { include: [app/auth-service/*] }
variables:
  - template: templates/vars.yml
  - group: shopsphere-secrets      # holds GH_PAT (secret)
stages:
  - template: templates/ci-service.yml
    parameters:
      serviceName: auth-service
      language: python
