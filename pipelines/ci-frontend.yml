trigger:
  branches: { include: [main] }
  paths: { include: [app/frontend/*, pipelines/templates/*] }
pr:
  branches: { include: [main] }
  paths: { include: [app/frontend/*] }
variables:
  - template: templates/vars.yml
  - group: shopsphere-secrets      # holds GH_PAT (secret)
stages:
  - template: templates/ci-service.yml
    parameters:
      serviceName: frontend
      language: static
