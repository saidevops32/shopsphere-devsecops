apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: disallow-latest-tag }
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match: { any: [{ resources: { kinds: [Pod], namespaces: ["shopsphere-*"] } }] }
      validate:
        message: "An explicit image tag is required."
        pattern: { spec: { containers: [{ image: "*:*" }] } }
    - name: block-latest
      match: { any: [{ resources: { kinds: [Pod], namespaces: ["shopsphere-*"] } }] }
      validate:
        message: "The 'latest' tag is mutable and not allowed."
        pattern: { spec: { containers: [{ image: "!*:latest" }] } }
