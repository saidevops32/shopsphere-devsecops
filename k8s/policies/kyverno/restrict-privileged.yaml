apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: restrict-privileged }
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-privileged-no-escalation
      match: { any: [{ resources: { kinds: [Pod], namespaces: ["shopsphere-*"] } }] }
      validate:
        message: "Privileged containers and privilege escalation are not allowed."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  =(privileged): false
