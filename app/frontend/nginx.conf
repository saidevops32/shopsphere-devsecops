worker_processes auto;
pid /tmp/nginx.pid;                 # writable path (read-only root filesystem)
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'" always;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://backend-api:3000; proxy_set_header Host $host; proxy_read_timeout 10s; }
    location / { try_files $uri /index.html; }
  }
}
